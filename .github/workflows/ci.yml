name: build and test

on:
  push:
  pull_request:
    branches: [ main ]
    paths:
    - '**.cs'
    - '**.csproj'

env:
  DOTNET_VERSION: '8.0.x' # The .NET SDK version to use

jobs:
  build-and-test:

    name: build-and-test-ubuntu-latest
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --configuration Release --no-restore # --configuration Debug if we're using a develop branch
      
    - name: Run tests with coverage
      run: dotnet test --configuration Release --no-build --no-restore --collect:"XPlat Code Coverage" # --configuration Debug if we're using a develop branch
      
    - name: Check code formatting
      run: dotnet format --verify-no-changes
    # Make sure github security scanner is set up correctly
    #- name: Security scan
    #  run: dotnet list package --vulnerable --include-transitive --severity high # Fail on high severity vulnerability
